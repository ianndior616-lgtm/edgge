<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EdGGe</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body style="margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh">
  <div>Opening EdGGe…</div>
  <script>
    (function () {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
        }
      } catch (_) {}

      var target = "/" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
